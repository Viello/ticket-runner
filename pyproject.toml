[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-runner"
version = "0.1.0"
description = "Local Python orchestrator for autonomous sequential OpenCode ticket execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
ticket-runner-scaffold-sandbox = "runner.tools.scaffold_sandbox:main"

[tool.setuptools.packages.find]
include = ["runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
extend-exclude = ["live-test-target", "scratch", ".tmp_test", "observations"]

[tool.ruff.lint]
# Pin the rule set so Ruff upgrades do not silently broaden the gate.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
exclude = ["^live-test-target/", "^scratch/", "^\\.tmp_test/", "^observations/"]

# Ticket Runner Configuration Template
# Copy this file to config.yaml and customize for your project:
#   cp config.example.yaml config.yaml (or Copy-Item config.example.yaml config.yaml in PowerShell)

project:
  name: "ticket-runner"
  # Dedicated working branch for autonomous agent work
  branch: "agent/ticket-runner"
  # Target base branch from which the agent branch stems
  base_branch: "main"

worker:
  # Skill path guiding the OpenCode worker during ticket execution
  execution_skill: ".agents/skills/implement/SKILL.md"

verification:
  # Independent test command run by Gatekeeper to verify ticket implementation
  test_cmd: "pytest"
  # Optional build command run before test_cmd (e.g., "npm run build" or "")
  build_cmd: ""
  # Maximum failed verification attempts before tripping the Circuit Breaker
  max_retries: 3
  # Maximum execution time in seconds for verification commands
  timeout_seconds: 300

tokens:
  # Token threshold to emit a warning to terminal / Discord
  warn: 120000
  # Token threshold to trigger a Context Handoff and write a checkpoint
  handoff: 135000
  # Hard token limit to force session rollover
  ceiling: 150000

presence:
  # Default operational mode on startup: "nearby" (local terminal) or "away" (Discord)
  default_mode: "nearby"
  # Minutes of idle inactivity on a worker prompt before escalating to Discord
  idle_escalation_minutes: 3

discord:
  # Enable or disable remote Discord bot integration
  enabled: true
  # Environment variable name containing the Discord bot token (never store the raw token here)
  token_env: "DISCORD_BOT_TOKEN"
  # Discord channel ID where ticket threads will be created
  channel_id: ""

lifecycle:
  # Behavior when all pending tickets are complete:
  #   "standby"   - Keep running and watch docs/tickets/ for new tickets
  #   "terminate" - Print summary and cleanly exit process
  queue_completion: "standby"

git:
  # Never push automatically (pre-push hook blocks remote pushes on the agent branch)
  auto_push: false
  # Prefix for conventional commit messages, e.g. feat(T001): Title
  commit_prefix: "feat"
  # Enforce pre-push hook verification during Doctor pre-flight checks
  enforce_pre_push_hook: true

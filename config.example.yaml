# Ticket Runner Configuration Template
# Copy this file to config.yaml and customize for your project:
#   cp config.example.yaml config.yaml (or Copy-Item config.example.yaml config.yaml in PowerShell)

project:
  name: "ticket-runner"
  # Dedicated working branch for autonomous agent work
  branch: "agent/ticket-runner"
  # Target base branch from which the agent branch stems
  base_branch: "main"

worker:
  # Skill path guiding the OpenCode worker during ticket execution
  execution_skill: ".agents/skills/implement/SKILL.md"

model:
  # Default reasoning variant passed as --variant (omitted when empty)
  default_reasoning: ""
  # Selectable models presented at startup or passed to OpenCode with -m
  models:
    - id: "deepseek/deepseek-chat"
      label: "DeepSeek Chat"
    - id: "qwen/qwen-plus"
      label: "Qwen Plus"


verification:
  # Independent test command run by Gatekeeper to verify ticket implementation
  test_cmd: "python -m pytest"
  # Optional build command run before test_cmd (e.g., "npm run build" or "")
  build_cmd: ""
  # Total Verification Attempts before the Circuit Breaker trips
  max_attempts: 3
  # Maximum execution time in seconds for the full verification run
  timeout_seconds: 300
  # Kill the verification subprocess if no stdout/stderr arrives for this many seconds.
  # NOTE: this guards the *test process*, not the Worker session (which has its own stall timeout).
  # Raise this value on slow hardware to avoid false-alarm kills during long test setup.
  silence_window_seconds: 60
  # When > 0, inject a runner-native per-test timeout flag (e.g. --timeout=N for pytest,
  # --testTimeout=N*1000 for jest/vitest, -timeout Ns for go test). 0 = disabled.
  # Runners without native support (cargo, dotnet) are unaffected; silence_window_seconds
  # remains their only guard.
  per_test_timeout_seconds: 0
  # Optional override for single-test isolation rerun. Use {test_id} as the placeholder.
  # Example: "pytest {test_id} -x"  or  "go test -run {test_name} ./..."
  # Leave empty to use the built-in runner heuristic.
  isolation_cmd: ""
  # Escalate the structured diagnostic report after this attempt number.
  #   -1 = only when the Circuit Breaker trips (all attempts exhausted)
  #    0 = never escalate automatically
  #    N = escalate after the Nth attempt (and always at Circuit Breaker)
  bug_escalation_at: 1

tokens:
  # Token threshold to emit a warning to terminal / Discord
  warn: 120000
  # Token threshold to trigger a Context Handoff and write a checkpoint
  handoff: 135000
  # Hard token limit to force session rollover
  ceiling: 150000

presence:
  # Default operational mode on startup: "nearby" (local terminal) or "away" (Discord)
  default_mode: "nearby"
  # Minutes of idle inactivity on a worker prompt before escalating to Discord
  idle_escalation_minutes: 3

discord:
  # Enable or disable remote Discord bot integration
  enabled: true
  # Environment variable name containing the Discord bot token (never store the raw token here)
  token_env: "DISCORD_BOT_TOKEN"
  # Discord channel ID where ticket threads will be created
  channel_id: ""

lifecycle:
  # Behavior when all pending tickets are complete:
  #   "standby"   - Keep running and watch docs/tickets/ for new tickets
  #   "terminate" - Print summary and cleanly exit process
  queue_completion: "standby"
  # Clean slate behavior when spec queue finishes:
  #   "interactive" - Prompt user [Y/n] to archive and wipe completed tickets/spec
  #   "always"      - Automatically archive and clean slate
  #   "never"       - Keep completed tickets and spec in working tree
  clean_slate: "interactive"
  # Standby watch loop polling interval in seconds
  poll_interval: 5.0

git:
  # Never push automatically (pre-push hook blocks remote pushes on the agent branch)
  auto_push: false
  # Prefix for conventional commit messages, e.g. feat(scope): Title
  commit_prefix: "feat"
  # Enforce pre-push hook verification during Doctor pre-flight checks
  enforce_pre_push_hook: true

ui:
  # Session terminal host: "auto" (default, sniffs active caller host),
  # or explicit host: "wt.exe", "pwsh.exe", "powershell.exe", "cmd.exe"
  session_terminal: "auto"
